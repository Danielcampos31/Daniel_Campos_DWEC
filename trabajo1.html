<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de videojuegos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Tabla de videojuegos</h1>

    <table id="tablaJuegos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Compañía</th>
                <th>Plataforma</th>
                <th>Valoración</th>
                <th>Precio</th>
            </tr>
        </thead>

        <tbody>
           
        </tbody>
    </table>

    <form id="formularioJuego">

    <h2>Añadir videojuego</h2>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre">

    <label for="compania">Compañía:</label>
    <input type="text" id="compania">

    <label for="plataforma">Plataforma:</label>
    <input type="text" id="plataforma">

    <label for="valoracion">Valoración:</label>
    <input type="number" id="valoracion" step="0.1">

    <label for="precio">Precio:</label>
    <input type="number" id="precio" step="0.01">

    <button type="button" id="anadirJuego">Añadir juego</button>

</form>

    <script src="app.js"></script>
</body>
</html>
