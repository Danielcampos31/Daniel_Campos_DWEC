<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>MoneyTrack</h1>

    <h2>Añadir movimiento</h2>

    <form id="formMovimiento">

        <label for="concepto">Concepto:</label>
        <input type="text" id="concepto">

        <label for="importe">Importe:</label>
        <input type="number" id="importe" step="0.01">

        <label for="categoria">Categoría:</label>
        <select id="categoria">
            <option value="Ingresos">Ingresos</option>
            <option value="Comida">Comida</option>
            <option value="Transporte">Transporte</option>
            <option value="Ocio">Ocio</option>
        </select>

        <button type="submit">Añadir movimiento</button>

    </form>

    <h2>Movimientos</h2>

    <label for="filtroCategoria">Filtrar por categoría:</label>

    <select id="filtroCategoria">
        <option value="Todas">Todas</option>
        <option value="Ingresos">Ingresos</option>
        <option value="Comida">Comida</option>
        <option value="Transporte">Transporte</option>
        <option value="Ocio">Ocio</option>
    </select>

    <section id="estadisticas">

        <h2>Estadísticas</h2>

        <p>
            Saldo actual:
            <strong id="saldoActual">0,00 €</strong>
        </p>

        <p>
            Total gastado:
            <strong id="totalGastado">0,00 €</strong>
        </p>

        <p>
            Categoría con mayor gasto:
            <strong id="mayorGasto">-</strong>
        </p>

    </section>

    <table>

        <thead>
            <tr>
                <th>Concepto</th>
                <th>Importe</th>
                <th>Categoría</th>
                <th>Fecha</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaMovimientos">
        </tbody>

    </table>

    <script src="app.js"></script>

</body>
</html>
